<bsb-card [title]="'contact me'" [isCloseEnabled]="false" [isMobile]="(isMobile$ | async) || false">
  @if(contactList$ | async) {
  <div class="content-wrapper">
    @for(item of (contactList$ | async); track $index) {
    <div class="item">
      <button class="link" type="button" (click)="openContact(item.value)">
        <bsb-icon [icon]="item.icon" [color]="orangeColor" [size]="'default-xl'"></bsb-icon>
        <bsb-text class="align-center" [label]="item.description" [color]="orangeColor"
          [fontWeight]="'bold'"></bsb-text>
      </button>
      @if(item.copyValue) {
      <button class="copy" type="button" (click)="copyToClipboard(item.copyValue)">
        <bsb-icon class="align-center" [icon]="'docs'" [color]="orangeColor"
          [size]="'default-sm'"></bsb-icon>
      </button>
      }
    </div>
    }
  </div>
  }
</bsb-card>
